name: Web build

# Builds the shared engine for JS, then the web app, then a browser smoke test.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  web:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shared engine (JS)
        run: ./gradlew :core:jvmTest :core:jsBrowserProductionLibraryDistribution --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Smoke test
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: firewatch-web
          path: web/dist
