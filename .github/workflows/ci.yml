name: CI

# Every push to a working branch: build, test, and prove the self-updater still works.
# Releases are handled by release-apk.yml (branch `apk`).
on:
  push:
    branches-ignore: [apk, webapp]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :core:test :app:testReleaseUnitTest :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: firewatch-apk
          path: app/build/outputs/apk/release/*.apk

  updater:
    name: Updater end-to-end
    uses: ./.github/workflows/e2e-updater.yml
