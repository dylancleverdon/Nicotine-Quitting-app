name: Release APK

# Every push to the `apk` branch publishes a new version that installs itself on D's phone.
# Bump version.properties (and add a CHANGELOG section) for each release; a push without a
# version bump is skipped.
on:
  push:
    branches: [apk]
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  updater:
    name: Updater end-to-end
    uses: ./.github/workflows/e2e-updater.yml

  release:
    name: Publish
    needs: updater
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: v
        run: |
          name=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          num=$(grep '^releaseNumber=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          prev=$(git tag -l 'apk-v*' --sort=-v:refname | head -n1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "tag=apk-v$name" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/apk-v$name" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::apk-v$name is already released. Bump version.properties to publish a new version."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.v.outputs.exists == 'false'
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/firewatch-${{ steps.v.outputs.name }}.apk"

      - name: Build rollback APK (previous release with a higher version code)
        if: steps.v.outputs.exists == 'false' && steps.v.outputs.prev != ''
        run: |
          code=$(( ${{ steps.v.outputs.num }} * 10 + 5 ))
          git worktree add ../prev "${{ steps.v.outputs.prev }}"
          (cd ../prev && ./gradlew :app:assembleRelease -PversionCodeOverride="$code" -Prollback=true --stacktrace)
          cp ../prev/app/build/outputs/apk/release/app-release.apk dist/firewatch-rollback.apk

      - name: Write update manifest
        if: steps.v.outputs.exists == 'false'
        run: |
          name="${{ steps.v.outputs.name }}"
          num="${{ steps.v.outputs.num }}"
          tag="${{ steps.v.outputs.tag }}"
          prev="${{ steps.v.outputs.prev }}"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"
          python3 scripts/release_notes.py app/src/main/assets/CHANGELOG.md "$name" > dist/notes.md
          args=(--out dist/update.json --notes-file dist/notes.md
                --latest "dist/firewatch-$name.apk" "$((num * 10))" "$name" "$base/firewatch-$name.apk")
          if [ -f dist/firewatch-rollback.apk ]; then
            args+=(--rollback dist/firewatch-rollback.apk "$((num * 10 + 5))" "${prev#apk-v}" "$base/firewatch-rollback.apk")
          fi
          python3 scripts/make_manifest.py "${args[@]}"
          cat dist/update.json

      - name: Publish versioned release
        if: steps.v.outputs.exists == 'false'
        run: |
          name="${{ steps.v.outputs.name }}"
          files=("dist/firewatch-$name.apk")
          if [ -f dist/firewatch-rollback.apk ]; then files+=(dist/firewatch-rollback.apk); fi
          gh release create "${{ steps.v.outputs.tag }}" "${files[@]}" \
            --title "Firewatch $name" --notes-file dist/notes.md --target "$GITHUB_SHA"

      - name: Point the stable links at this release
        if: steps.v.outputs.exists == 'false'
        run: |
          cp "dist/firewatch-${{ steps.v.outputs.name }}.apk" dist/firewatch.apk
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --title "Firewatch (always the newest)" --latest=false --target "$GITHUB_SHA" \
              --notes "Stable links for Firewatch by Baastik Labs: firewatch.apk is always the newest version, update.json is what the app checks for updates."
          fi
          # Upload the APK first so update.json never points at something missing.
          gh release upload apk-latest dist/firewatch.apk --clobber
          gh release upload apk-latest dist/update.json --clobber
